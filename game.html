<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лес — Космические Хроники Зверьков</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@300;600&family=Rubik+One&display=swap" rel="stylesheet">

<link rel="stylesheet" href="game.css">
</head>
<body>

<canvas id="c"></canvas>

<button class="back-btn" onclick="location.href='map.html'">← На карту</button>

<div id="hud">
    <div class="hud-item lives">
        <span class="icon">❤️</span>
        <span class="value" id="hud-lives">❤️❤️❤️</span>
    </div>
    <div class="hud-item">
        <span class="icon">🍓</span>
        <span class="value" id="hud-berries">0 / 0</span>
    </div>
    <div class="hud-item">
        <span class="icon">💎</span>
        <span class="value" id="hud-crystals">0 / 0</span>
    </div>
    <div class="hud-item">
        <span class="icon">🌰</span>
        <span class="value" id="hud-nuts">0 / 0</span>
    </div>
    <div class="hud-item portal">
        <span class="label">Портал</span>
        <span class="value" id="hud-portal">ЗАКРЫТ</span>
    </div>
</div>

<div class="controls-hint">
    <b>← →</b> бег · <b>↑ / W / Space</b> прыжок (двойной) · <b>Shift</b> рывок
</div>

<div id="win-screen">
    <div class="win-panel">
        <h1>ЭВАКУАЦИЯ!</h1>
        <div class="subtitle">Ты добрался до портала с орехом</div>
        <div id="win-stats"></div>
        <div class="win-buttons">
            <button class="primary" id="btn-restart">Играть заново</button>
            <button class="secondary" id="btn-to-map">На карту мира</button>
        </div>
    </div>
</div>

<script src="audio.js"></script>
<script src="level.js"></script>
<script src="player.js"></script>
<script src="tiles.js"></script>
<script src="game.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — Космические Хроники Зверьков</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Montserrat:wght@300&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="menu.css">

<style>
    .page-title {
        font-family: 'Rubik One', sans-serif;
        font-size: clamp(28px, 4vw, 52px);
        letter-spacing: 0.12em;
        background: linear-gradient(135deg, #a8c8ff 0%, #88ffcc 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(100, 200, 255, 0.5));
        text-align: center;
        margin-bottom: 6vh;
        pointer-events: auto;
        animation: titlePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes titlePop {
        0%   { opacity: 0; transform: scale(0.8) translateY(-20px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .settings-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1vh;
        pointer-events: auto;
        width: 100%;
        max-width: 520px;
    }

    .setting-item {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
        padding: 10px 44px;
        color: #c8b8a8;
        font-family: 'Caveat', cursive;
        font-size: 26px;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 5px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.7);
        opacity: 0;
        animation: fadeUp 0.7s cubic-bezier(0.34,1.3,0.64,1) forwards;
        transition: color 0.3s ease;
        width: 100%;
    }
    .setting-item:nth-child(1) { animation-delay: 0.5s; }
    .setting-item:nth-child(2) { animation-delay: 0.65s; }
    .setting-item:nth-child(3) { animation-delay: 0.8s; }
    .setting-item:hover { color: #fff5e0; }

    .setting-item::before {
        content: '';
        position: absolute;
        inset: -4px -20px;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 70' preserveAspectRatio='none'><path d='M 120 8 C 60 4, 10 22, 12 40 C 14 58, 70 68, 120 64 C 180 60, 232 46, 228 30 C 224 14, 170 6, 110 12 C 80 16, 56 22, 50 30' fill='none' stroke='%23c8b8a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
        background-repeat: no-repeat;
        background-size: 100% 100%;
        filter: drop-shadow(0 0 5px rgba(200,184,168,0.5));
    }
    .setting-item:hover::before,
    .setting-item:focus-within::before {
        opacity: 1;
        transform: scale(1);
    }

    .setting-item .label {
        position: relative;
        z-index: 2;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 52px; height: 28px;
        flex-shrink: 0;
        z-index: 2;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
        position: absolute; cursor: pointer; inset: 0;
        background: rgba(100,150,255,0.2);
        border: 1px solid rgba(100,150,255,0.3);
        border-radius: 28px;
        transition: all 0.3s;
    }
    .switch .slider::before {
        content: '';
        position: absolute; top: 2px; left: 2px;
        width: 22px; height: 22px;
        background: #8a9ac8;
        border-radius: 50%;
        transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .switch input:checked + .slider {
        background: rgba(100,255,200,0.3);
        border-color: rgba(100,255,200,0.6);
    }
    .switch input:checked + .slider::before {
        background: #88ffcc;
        transform: translateX(24px);
        box-shadow: 0 0 12px rgba(100,255,200,0.7);
    }

    .nick-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 44px;
        opacity: 0;
        animation: fadeUp 0.7s cubic-bezier(0.34,1.3,0.64,1) 0.35s forwards;
        width: 100%;
    }

    .nick-input {
        width: 100%;
        max-width: 220px;
        padding: 8px 16px;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(200, 184, 168, 0.4);
        color: #d0e0ff;
        font-family: 'Caveat', cursive;
        font-size: 24px;
        text-align: center;
        outline: none;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
        transition: all 0.2s;
    }
    .nick-input:focus {
        border-bottom-color: rgba(168, 200, 255, 0.9);
        color: #fff;
    }
    .nick-input::placeholder {
        color: #6a7a9a;
        font-style: italic;
    }

    .color-input {
        width: 60px;
        height: 36px;
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 0;
    }

    .section-label {
        font-family: 'Caveat', cursive;
        font-size: 18px;
        color: #6a7a9a;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin: 2vh 0 1vh;
        opacity: 0;
        animation: fadeUp 0.7s cubic-bezier(0.34,1.3,0.64,1) 0.3s forwards;
    }
</style>
</head>
<body>

<div class="scene">
    <div class="bg-container">
        <div class="sky parallax-layer" data-speed="0"></div>
        <div class="stars parallax-layer" id="stars" data-speed="0.1"></div>
        <div class="planet-far parallax-layer" data-speed="0.15"></div>
    </div>

    <div class="gradient-layer">
        <div class="gradient-top"></div>
        <div class="gradient-bottom"></div>
    </div>

    <div class="comet-container" id="comet-container"></div>
    <div class="vignette"></div>

    <a href="index.html" class="back-btn">← В меню</a>

    <div class="ui-center-group">
        <h1 class="page-title">НАСТРОЙКИ</h1>

        <div class="settings-list">
            <div class="section-label">Персонаж</div>

            <div class="nick-input-wrap">
                <input type="text" class="nick-input" id="nickname-input" placeholder="Введите ник..." maxlength="16">
            </div>

            <div class="setting-item">
                <span class="label">🎨 Цвет персонажа</span>
                <input type="color" id="color-input" class="color-input" value="#ffd84a">
            </div>

            <div class="setting-item">
                <span class="label">✏️ Цвет ника</span>
                <input type="color" id="nick-color-input" class="color-input" value="#d0e0ff">
            </div>

            <div class="section-label">Камера</div>

            <div class="setting-item">
                <span class="label">🎯 Центрирование карты</span>
                <label class="switch">
                    <input type="checkbox" id="setting-center" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <span class="label">🎮 Слежение за героем</span>
                <label class="switch">
                    <input type="checkbox" id="setting-follow">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="footer">v0.3 alpha <span>•</span> forest edition</div>
</div>

<script src="menu.js"></script>
<script>
    (() => {
        const settingCenter = document.getElementById('setting-center');
        const settingFollow = document.getElementById('setting-follow');
        const nicknameInput = document.getElementById('nickname-input');
        const colorInput = document.getElementById('color-input');
        const nickColorInput = document.getElementById('nick-color-input');

        try {
            const saved = JSON.parse(localStorage.getItem('kz_settings') || '{}');
            if (typeof saved.centerMap === 'boolean') settingCenter.checked = saved.centerMap;
            if (typeof saved.followPlayer === 'boolean') settingFollow.checked = saved.followPlayer;
        } catch (e) {}

        try {
            const nick = localStorage.getItem('kz_nickname');
            if (nick) nicknameInput.value = nick;
            const color = localStorage.getItem('kz_color');
            if (color) colorInput.value = color;
            const nickColor = localStorage.getItem('kz_nick_color');
            if (nickColor) nickColorInput.value = nickColor;
        } catch (e) {}

        function saveSettings() {
            localStorage.setItem('kz_settings', JSON.stringify({
                centerMap: settingCenter.checked,
                followPlayer: settingFollow.checked
            }));
        }

        settingCenter.addEventListener('change', () => {
            if (settingCenter.checked) settingFollow.checked = false;
            saveSettings();
        });
        settingFollow.addEventListener('change', () => {
            if (settingFollow.checked) settingCenter.checked = false;
            saveSettings();
        });

        nicknameInput.addEventListener('input', () => {
            const nick = nicknameInput.value.trim();
            try {
                if (nick) localStorage.setItem('kz_nickname', nick);
                else localStorage.removeItem('kz_nickname');
            } catch (e) {}
        });

        colorInput.addEventListener('input', () => {
            try { localStorage.setItem('kz_color', colorInput.value); } catch (e) {}
        });

        nickColorInput.addEventListener('input', () => {
            try { localStorage.setItem('kz_nick_color', nickColorInput.value); } catch (e) {}
        });

        nicknameInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
        });
    })();
</script>

</body>
</html>

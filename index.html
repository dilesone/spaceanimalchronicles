<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Космические Хроники Зверьков</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Montserrat:wght@300&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="menu.css">
</head>
<body>

<div class="scene">
    <div class="bg-container">
        <div class="sky parallax-layer" data-speed="0"></div>
        <div class="stars parallax-layer" id="stars" data-speed="0.1"></div>
        <div class="planet-far parallax-layer" data-speed="0.15"></div>
    </div>

    <div class="gradient-layer">
        <div class="gradient-top"></div>
        <div class="gradient-bottom"></div>
    </div>

    <div class="comet-container" id="comet-container"></div>
    <div class="vignette"></div>

    <div class="ui-center-group">
        <div class="logo-container" id="logoContainer">
            <div class="logo-top">Космические</div>
            <div class="logo-bottom" id="logoBottom">
                <div class="logo-line" id="line1"></div>
                <div class="logo-line" id="line2"></div>
            </div>
        </div>

        <div class="menu">
            <a class="menu-item" href="map.html">Играть</a>
            <a class="menu-item" href="editor.html">Редактор</a>
            <a class="menu-item" href="#" data-action="sanctuary">Убежище</a>
            <a class="menu-item" href="settings.html">Настройки</a>
            <a class="menu-item" href="#" data-action="quit">Выйти</a>
        </div>
    </div>

    <div class="footer">v0.3 alpha <span>•</span> forest edition</div>
</div>

<script src="menu.js"></script>

</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лес — Космические Хроники Зверьков</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@300;600;700;800&family=Rubik+One&display=swap" rel="stylesheet">

<link rel="stylesheet" href="game.css">
</head>
<body>

<canvas id="c"></canvas>

<!-- ВЕРХНИЙ HUD -->
<div class="hud-top">
    
    <!-- Левая часть: Профиль -->
    <div class="hud-element profile-card">
        <div class="avatar" id="profile-avatar"></div>
        <div class="profile-info">
            <div class="profile-name" id="profile-nick">Игрок</div>
            <div class="profile-stats">
                <span id="profile-level">Lvl 1</span>
                <span id="profile-lives">❤️❤️❤️</span>
            </div>
            <div class="profile-xp"><div class="profile-xp-fill" id="profile-xp-fill"></div></div>
        </div>
    </div>

    <!-- Центр: Таймер + Эвакуация -->
    <div class="center-group">
        <div class="hud-element timer-box" id="hud-timer">05:00</div>
        
        <div class="hud-element portal-block" id="portal-block">
            <div class="portal-icon">🌀</div>
            <div class="portal-data">
                <div class="portal-title">ЭВАКУАЦИЯ</div>
                <div class="portal-bar-bg">
                    <div class="portal-bar-fill" id="portal-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Правая часть: Ресурсы + Меню -->
    <div class="right-group">
        <div class="hud-element resources">
            <div class="res-item"><span class="icon">🍓</span> <span class="val" id="hud-berries">0/0</span></div>
            <div class="res-item"><span class="icon">💎</span> <span class="val" id="hud-crystals">0/0</span></div>
            <div class="res-item" id="nut-res-item"><span class="icon">🌰</span> <span class="val" id="hud-nuts">0/0</span></div>
        </div>
        
        <button class="hud-element burger-btn" id="profile-menu-btn" title="Меню">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>
    </div>
</div>

<div class="controls-hint">
    <b>← →</b> бег · <b>↑ / W / Space</b> прыжок · <b>Shift</b> рывок · <b>Esc</b> пауза
</div>

<div id="chat" class="chat">
    <div class="chat-resizer" id="chat-resizer"></div>
    <div class="chat-header">
        <div class="chat-title">💬 Чат <span id="online-count" style="font-size: 14px; color: #8a9ac8; font-weight: 400; margin-left: 6px;">(онлайн 1)</span></div>
        <div class="chat-actions">
            <button class="chat-btn" id="chat-settings-btn" title="Настройки чата">⚙</button>
            <button class="chat-btn" id="chat-toggle" title="Свернуть">—</button>
        </div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
        <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение..." maxlength="120">
        <button class="chat-send" id="chat-send">→</button>
    </div>
    <div class="chat-settings hidden" id="chat-settings">
        <label class="chat-setting">
            <span>🕒 Показывать время</span>
            <label class="switch small">
                <input type="checkbox" id="chat-show-time">
                <span class="slider"></span>
            </label>
        </label>
        <label class="chat-setting">
            <span>🔔 Звук сообщения</span>
            <label class="switch small">
                <input type="checkbox" id="chat-sound" checked>
                <span class="slider"></span>
            </label>
        </label>
        <label class="chat-setting">
            <span>📢 Системные сообщения</span>
            <label class="switch small">
                <input type="checkbox" id="chat-system" checked>
                <span class="slider"></span>
            </label>
        </label>
        <div class="chat-setting">
            <span>🧹 Очистить историю</span>
            <button class="chat-btn" id="chat-clear" style="color:#ff7088;">Очистить</button>
        </div>
    </div>
</div>

<div id="win-screen" class="fullscreen">
    <div class="win-panel">
        <h1>ЭВАКУАЦИЯ!</h1>
        <div class="subtitle">Ты добрался до портала с орехом</div>
        
        <!-- Статистика и Опыт -->
        <div class="win-stats-container" id="win-stats">
            <!-- Сюда JS вставит статистику и опыт -->
        </div>
        
        <!-- Кнопки -->
        <div class="buttons win-buttons">
            <!-- Кнопка ожидания (неактивна, показываем для информации) -->
            <button class="menu-btn" id="btn-wait" disabled style="opacity: 0.7; cursor: default;">⏳ Ожидание игроков...</button>
            
            <!-- Кнопка "Продолжить один" -->
            <button class="menu-btn" id="btn-solo-next">🎲 Продолжить один</button>
            
            <!-- Кнопка "В меню" -->
            <button class="menu-btn" id="btn-leave-alone">🚪 Уйти в меню</button>
        </div>
    </div>
</div>

<div id="pause-screen" class="fullscreen">
    <div class="win-panel">
        <h1>ПАУЗА</h1>
        <div class="subtitle">отдохни немного</div>
        <div class="buttons">
            <button class="menu-btn" id="btn-resume">Продолжить</button>
            <button class="menu-btn" id="btn-pause-settings">Настройки</button>
            <button class="menu-btn" id="btn-pause-restart">Заново</button>
            <button class="menu-btn" id="btn-pause-menu">В меню</button>
        </div>

        <div id="pause-settings" class="pause-settings hidden">
            <div class="pause-nick">
                <label class="pause-nick-label">👤 Ник персонажа</label>
                <input type="text" id="pause-nickname" class="pause-nick-input" maxlength="16" placeholder="Игрок">
            </div>
            
            <div class="setting-item">
                <span class="label">🎯 Центрирование карты</span>
                <label class="switch">
                    <input type="checkbox" id="setting-center" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span class="label">🎮 Слежение за героем</span>
                <label class="switch">
                    <input type="checkbox" id="setting-follow">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
</div>

<!-- ЭМОЦИИ (Колесо) -->
<div class="emote-wheel" id="emoteWheel">
    <div class="wheel-container" id="wheelContainer">
        <div class="emote-sector pos-up" data-emote="heart" data-key="1">❤️ <span class="sector-key">1</span></div>
        <div class="emote-sector pos-right" data-emote="laugh" data-key="2">😂 <span class="sector-key">2</span></div>
        <div class="emote-sector pos-down" data-emote="sad" data-key="3">😢 <span class="sector-key">3</span></div>
        <div class="emote-sector pos-left" data-emote="angry" data-key="4">😡 <span class="sector-key">4</span></div>
    </div>
</div>

<div id="mobile-controls" class="mobile-controls">
    <!-- Левая часть: движение -->
    <div class="dpad">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    
    <!-- Правая часть: действия -->
    <div class="action-btns">
        <button class="ctrl-btn action-btn" id="btn-jump">JUMP</button>
        <button class="ctrl-btn action-btn" id="btn-dash">DASH</button>
    </div>
</div>

<script src="audio.js"></script>
<script src="level-generator.js"></script>
<script src="level.js"></script>
<script src="player.js"></script>
<script src="tiles.js"></script>
<script src="game.js"></script>

</body>
</html>

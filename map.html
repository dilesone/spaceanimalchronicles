<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта мира — Космические Хроники Зверьков</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Montserrat:wght@300&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="menu.css">

<style>
    .page-title {
        font-family: 'Rubik One', sans-serif;
        font-size: clamp(28px, 4vw, 52px);
        letter-spacing: 0.12em;
        background: linear-gradient(135deg, #a8c8ff 0%, #88ffcc 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 30px rgba(100, 200, 255, 0.5));
        text-align: center;
        margin-bottom: 6vh;
        pointer-events: auto;
        animation: titlePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes titlePop {
        0%   { opacity: 0; transform: scale(0.8) translateY(-20px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .locations {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 1.5vw;
        max-width: 1300px;
        width: 100%;
        pointer-events: auto;
    }

    .loc {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 12px;
        cursor: pointer;
        text-decoration: none;
        opacity: 0;
        animation: fadeUp 0.7s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .loc:nth-child(1) { animation-delay: 0.25s; }
    .loc:nth-child(2) { animation-delay: 0.4s; }
    .loc:nth-child(3) { animation-delay: 0.55s; }
    .loc:nth-child(4) { animation-delay: 0.7s; }
    .loc:nth-child(5) { animation-delay: 0.85s; }

    .loc:hover { transform: translateY(-6px); }

    .loc::before {
        content: '';
        position: absolute;
        inset: -8px -10px;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 70' preserveAspectRatio='none'><path d='M 120 8 C 60 4, 10 22, 12 40 C 14 58, 70 68, 120 64 C 180 60, 232 46, 228 30 C 224 14, 170 6, 110 12 C 80 16, 56 22, 50 30' fill='none' stroke='%23c8b8a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
        background-repeat: no-repeat;
        background-size: 100% 100%;
        filter: drop-shadow(0 0 5px rgba(200, 184, 168, 0.5));
    }
    .loc:hover::before {
        opacity: 1;
        transform: scale(1);
    }

    .loc-icon {
        font-size: clamp(44px, 6vw, 76px);
        margin-bottom: 12px;
        filter: drop-shadow(0 0 20px rgba(168, 200, 255, 0.4));
        transition: transform 0.3s, filter 0.3s;
    }
    .loc:hover .loc-icon {
        transform: scale(1.1) rotate(-3deg);
        filter: drop-shadow(0 0 30px rgba(168, 200, 255, 0.8));
    }

    .loc-name {
        font-family: 'Caveat', cursive;
        font-weight: 700;
        font-size: clamp(22px, 2.4vw, 34px);
        color: #c8b8a8;
        margin-bottom: 4px;
        letter-spacing: 0.05em;
        text-align: center;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 0, 0, 0.7);
        transition: color 0.3s, text-shadow 0.3s;
    }
    .loc:hover .loc-name {
        color: #fff5e0;
        text-shadow: 0 0 20px rgba(168, 200, 255, 0.6), 0 2px 5px rgba(0, 0, 0, 0.9);
    }

    .loc-desc {
        font-family: 'Caveat', cursive;
        font-size: clamp(12px, 1.1vw, 16px);
        color: #8a9ac8;
        text-align: center;
        letter-spacing: 0.03em;
        line-height: 1.4;
        transition: color 0.3s;
    }
    .loc:hover .loc-desc {
        color: #a8c8ff;
    }

    .loc-lock {
        position: absolute;
        top: 6px;
        right: 10px;
        font-size: 20px;
        opacity: 0.6;
    }

    .loc.locked {
        cursor: not-allowed;
        filter: grayscale(0.8);
        opacity: 0.35 !important;
    }
    .loc.locked:hover { transform: none; }
    .loc.locked:hover::before { opacity: 0; }

    .loc.completed .loc-icon {
        filter: drop-shadow(0 0 25px rgba(100, 255, 200, 0.8));
    }
    .loc.completed::after {
        content: '✓';
        position: absolute;
        top: 6px;
        right: 10px;
        font-size: 22px;
        color: #88ffcc;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(100, 255, 200, 0.8);
    }

    .loc.random .loc-icon {
        filter: drop-shadow(0 0 25px rgba(100, 255, 200, 0.6));
    }
    .loc.random .loc-name {
        background: linear-gradient(135deg, #a8c8ff 0%, #88ffcc 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }

    @media (max-width: 1100px) {
        .locations { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 700px) {
        .locations { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<div class="scene">
    <div class="bg-container">
        <div class="sky parallax-layer" data-speed="0"></div>
        <div class="stars parallax-layer" id="stars" data-speed="0.1"></div>
        <div class="planet-far parallax-layer" data-speed="0.15"></div>
    </div>

    <div class="gradient-layer">
        <div class="gradient-top"></div>
        <div class="gradient-bottom"></div>
    </div>

    <div class="comet-container" id="comet-container"></div>
    <div class="vignette"></div>

    <a href="index.html" class="back-btn">← В меню</a>

    <div class="ui-center-group">
        <h1 class="page-title">КАРТА МИРА</h1>
        <div class="locations" id="locations"></div>
    </div>

    <div class="footer">v0.3 alpha <span>•</span> forest edition</div>
</div>

<script src="menu.js"></script>
<script>
    (() => {
        const LOCATIONS = [
            {
                key: 'forest',
                name: 'Лес',
                icon: '🌲',
                desc: 'Зелёная чаща<br>с ягодами и кристаллами',
                theme: 'forest',
                type: 'fixed',
                unlockAfter: null
            },
            {
                key: 'desert',
                name: 'Пустыня',
                icon: '🏜️',
                desc: 'Бескрайние пески<br>и жаркое солнце',
                theme: 'desert',
                type: 'fixed',
                unlockAfter: 'forest'
            },
            {
                key: 'mountains',
                name: 'Горы',
                icon: '⛰️',
                desc: 'Снежные вершины<br>и головокружительные обрывы',
                theme: 'mountains',
                type: 'fixed',
                unlockAfter: 'desert'
            },
            {
                key: 'dungeon',
                name: 'Подземелья',
                icon: '🕳️',
                desc: 'Тёмные пещеры<br>и забытые сокровища',
                theme: 'dungeon',
                type: 'fixed',
                unlockAfter: 'mountains'
            },
            {
                key: 'random',
                name: 'Случайный мир',
                icon: '🎲',
                desc: 'Новый уровень<br>каждый раз',
                type: 'random',
                isRandom: true
            }
        ];

        function loadProgress() {
            try {
                return JSON.parse(localStorage.getItem('kz_progress') || '{}');
            } catch (e) { return {}; }
        }

        function isUnlocked(loc, progress) {
            if (loc.isRandom) return true;
            if (loc.unlockAfter === null) return true;
            return progress[loc.unlockAfter] === true;
        }

        const container = document.getElementById('locations');
        const progress = loadProgress();

        LOCATIONS.forEach(loc => {
            const unlocked = isUnlocked(loc, progress);
            const completed = !loc.isRandom && progress[loc.key] === true;

            const el = document.createElement('div');
            el.className = 'loc'
                + (unlocked ? '' : ' locked')
                + (loc.isRandom ? ' random' : '')
                + (completed ? ' completed' : '');

            el.innerHTML = `
                ${!unlocked ? '<div class="loc-lock">🔒</div>' : ''}
                <div class="loc-icon">${loc.icon}</div>
                <div class="loc-name">${loc.name}</div>
                <div class="loc-desc">${loc.desc}</div>
            `;

            if (unlocked) {
                el.addEventListener('click', () => {
                    el.style.transition = 'all 0.25s';
                    el.style.transform = 'scale(0.95)';
                    el.style.opacity = '0.6';

                    // ОЧИЩАЕМ ТЕКУЩУЮ КОМНАТУ, чтобы игра искала/создавала новую
                    localStorage.removeItem('kz_current_room');

                    if (loc.type === 'fixed') {
                        localStorage.setItem('kz_play_mode', 'fixed');
                        localStorage.setItem('kz_play_key', loc.key);
                        localStorage.setItem('kz_play_theme', loc.theme);
                        localStorage.removeItem('kz_random_seed');
                        localStorage.removeItem('kz_editor_level');
                    } else if (loc.type === 'random') {
                        const seed = Math.floor(Math.random() * 1e9);
                        localStorage.setItem('kz_random_seed', String(seed));
                        localStorage.setItem('kz_play_mode', 'random');
                        localStorage.removeItem('kz_editor_level');
                    }

                    setTimeout(() => {
                        window.location.href = 'game.html';
                    }, 200);
                });
            }

            container.appendChild(el);
        });
    })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Космические Хроники Зверьков</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Montserrat:wght@300&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; }

    .scene { position: fixed; inset: 0; overflow: hidden; }

    /* ═══════════════ ФОН ═══════════════ */
    .bg-container { position: absolute; inset: -10%; pointer-events: none; z-index: 1; }
    .sky {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 100%, #0a1020 0%, #02040a 70%),
                    linear-gradient(180deg, #010206 0%, #030610 50%, #060a18 100%);
    }
    .planet-far {
        position: absolute; top: 15%; right: 15%; width: 180px; height: 180px; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #3a5a7a, #0f1a2a 80%);
        box-shadow: inset -30px -30px 60px rgba(0,0,0,0.9), 0 0 60px rgba(100, 150, 255, 0.15);
        opacity: 0.7;
    }
    .planet-far::after {
        content: ''; position: absolute; top: 50%; left: 50%; width: 250%; height: 40%; border-radius: 50%;
        border: 4px solid rgba(100, 150, 255, 0.15); transform: translate(-50%, -50%) rotate(-15deg);
    }
    .stars { position: absolute; inset: 0; z-index: 3; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* ═══════════════ ГРАДИЕНТЫ ═══════════════ */
    .gradient-layer {
        position: absolute; inset: 0; z-index: 5;
        pointer-events: none; mix-blend-mode: screen;
    }
    .gradient-top, .gradient-bottom {
        position: absolute; left: 0; right: 0; height: 50%;
        opacity: 0.8; filter: blur(60px);
    }
    .gradient-top {
        top: 0;
        background: radial-gradient(ellipse at 50% 0%, rgba(50, 150, 255, 0.7) 0%, transparent 70%);
        animation: topShift 15s ease-in-out infinite alternate;
    }
    .gradient-bottom {
        bottom: 0;
        background: radial-gradient(ellipse at 50% 100%, rgba(40, 230, 200, 0.7) 0%, transparent 70%);
        animation: bottomShift 15s ease-in-out infinite alternate;
        animation-delay: -7.5s;
    }
    @keyframes topShift {
        0%   { transform: scale(1); opacity: 0.6; filter: blur(60px) hue-rotate(0deg); }
        100% { transform: scale(1.2); opacity: 0.9; filter: blur(80px) hue-rotate(-20deg); }
    }
    @keyframes bottomShift {
        0%   { transform: scale(1); opacity: 0.6; filter: blur(60px) hue-rotate(0deg); }
        100% { transform: scale(1.2); opacity: 0.9; filter: blur(80px) hue-rotate(20deg); }
    }

    /* ═══════════════ КОМЕТЫ ═══════════════ */
    .comet-container { position: absolute; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
    .comet {
        position: absolute; width: 6px; height: 6px;
        background: #fff; border-radius: 50%;
        box-shadow: 0 0 10px 2px #fff, 0 0 30px 10px #a8d8ff, 0 0 60px 20px rgba(100, 200, 255, 0.5);
        animation: shootComet 6s linear forwards;
        opacity: 0;
    }
    .comet::after {
        content: ''; position: absolute; top: 50%; left: 100%; width: 400px; height: 2px;
        background: linear-gradient(90deg, transparent, #a8d8ff 60%, #fff);
        transform: translateY(-50%) rotate(-45deg);
        transform-origin: left center;
        border-radius: 50%; filter: blur(2px); opacity: 0.8;
    }
    .comet::before {
        content: ''; position: absolute; top: 50%; left: 100%; width: 200px; height: 8px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6));
        transform: translateY(-50%) rotate(-45deg);
        transform-origin: left center;
        border-radius: 50%; filter: blur(4px); opacity: 0.5;
    }
    @keyframes shootComet {
        0%   { transform: translate(0, 0); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translate(-120vw, 120vh); opacity: 0; }
    }

    /* ═══════════════ ВИНЬЕТКА ═══════════════ */
    .vignette {
        position: absolute; inset: 0; z-index: 20; pointer-events: none;
        background: radial-gradient(ellipse at 50% 40%, transparent 20%, rgba(0,0,0,0.85) 100%);
    }

    /* ═══════════════ UI ═══════════════ */
    .ui-center-group {
        position: fixed; inset: 0; z-index: 30;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        pointer-events: none; padding-bottom: 5vh;
    }

    .logo-container {
        position: relative; display: flex; flex-direction: column; align-items: center;
        pointer-events: auto; animation: logoPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        opacity: 0; transform: scale(0.8); margin-bottom: 4vh;
    }
    .logo-top {
        font-family: 'Montserrat', sans-serif; font-weight: 300;
        font-size: clamp(14px, 1.6vw, 22px); color: #d0e0ff;
        letter-spacing: 1.2em; text-transform: uppercase;
        margin-bottom: 2vh; margin-left: 1.2em; z-index: 10;
        text-shadow: 0 2px 15px rgba(0,0,0,1);
    }
    .logo-bottom {
        display: flex; flex-direction: column; align-items: center;
        font-family: 'Rubik One', sans-serif;
        font-size: clamp(45px, 7.5vw, 110px);
        line-height: 0.8; text-transform: uppercase;
    }
    .logo-line { display: flex; justify-content: center; align-items: flex-end; }
    .logo-letter {
        display: inline-block; margin: 0 -0.01em; color: #f0f4ff;
        text-shadow: 4px 6px 0 #2a2a5a, -2px -2px 0 #0a0a1a, 2px 2px 0 #0a0a1a, 8px 12px 15px rgba(0,0,0,0.9);
        filter: drop-shadow(0px 0px 15px rgba(168, 200, 255, 0.3));
    }
    .planet-o {
        position: relative; display: inline-flex; align-items: center; justify-content: center;
        width: 0.85em; height: 0.85em; margin: 0 0.05em;
        vertical-align: baseline; transform: translateY(0.1em) !important;
        text-shadow: none; color: transparent;
    }
    .planet-o::before {
        content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #d0e0ff 0%, #4a6a9a 40%, #1a2a4a 80%, #0a101a 100%);
        box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 25px rgba(100,150,255,0.6);
        z-index: 2;
    }
    .planet-o::after {
        content: ''; position: absolute; width: 160%; height: 25%; border-radius: 50%;
        border: 3px solid rgba(200, 220, 255, 0.8); background: rgba(100, 150, 255, 0.1);
        transform: rotate(-20deg); box-shadow: 0 0 10px rgba(100,150,255,0.4);
        z-index: 1;
    }
    .logo-line:nth-child(1) .logo-letter:nth-child(odd)  { transform: translateY(-6px) rotate(-2deg); }
    .logo-line:nth-child(1) .logo-letter:nth-child(even) { transform: translateY(4px) rotate(2deg); }
    .logo-line:nth-child(2) .logo-letter:nth-child(3n+1) { transform: translateY(-8px) rotate(-3deg); }
    .logo-line:nth-child(2) .logo-letter:nth-child(3n+2) { transform: translateY(2px) rotate(1deg); }
    .logo-line:nth-child(2) .logo-letter:nth-child(3n)   { transform: translateY(-2px) rotate(-1deg); }

    .logo-star {
        position: absolute; color: #fff;
        text-shadow: 0 0 10px #a8c8ff, 0 0 20px #7a5cff;
        animation: starPulse 2s infinite alternate;
        z-index: 3;
    }
    .logo-star::before { content: '✦'; }
    @keyframes starPulse { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.2); opacity: 1; } }
    @keyframes logoPop { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

    /* ═══════════════ МЕНЮ ═══════════════ */
    .menu { display: flex; flex-direction: column; align-items: center; gap: 1vh; pointer-events: auto; }
    .menu-item {
        position: relative; background: none; border: none; padding: 6px 44px;
        font-family: 'Caveat', cursive; font-weight: 400;
        font-size: clamp(24px, 2.8vw, 38px);
        color: #c8b8a8; letter-spacing: 0.05em; cursor: pointer;
        transition: color 0.3s ease, transform 0.2s, text-shadow 0.3s;
        text-shadow: 0 2px 5px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.7);
        opacity: 0; animation: fadeUp 0.7s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
    }
    .menu-item:nth-child(1) { animation-delay: 0.5s; }
    .menu-item:nth-child(2) { animation-delay: 0.65s; }
    .menu-item:nth-child(3) { animation-delay: 0.8s; }
    .menu-item:nth-child(4) { animation-delay: 0.95s; }
    .menu-item:nth-child(5) { animation-delay: 1.1s; }
    .menu-item:hover, .menu-item:focus { color: #fff5e0; outline: none; transform: scale(1.05); }
    .menu-item .circle {
        position: absolute; inset: -4px -20px; pointer-events: none; opacity: 0; transform: scale(0.85);
        transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .menu-item:hover .circle, .menu-item:focus .circle, .menu-item.active .circle { opacity: 1; transform: scale(1); }
    .menu-item .circle svg { width: 100%; height: 100%; overflow: visible; }
    .menu-item .circle path {
        fill: none; stroke: #c8b8a8; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round;
        filter: drop-shadow(0 0 5px rgba(200, 184, 168, 0.5));
        stroke-dasharray: 400; stroke-dashoffset: 400; transition: stroke-dashoffset 0.4s ease;
    }
    .menu-item:hover .circle path, .menu-item:focus .circle path, .menu-item.active .circle path { stroke-dashoffset: 0; }

    .footer {
        position: absolute; bottom: 3vh; left: 0; right: 0; text-align: center;
        font-family: 'Rubik One', sans-serif; font-size: 12px; letter-spacing: 0.25em;
        color: #3a4a5a; z-index: 30; opacity: 0; animation: fadeIn 2s 1.5s forwards;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 768px) {
        .logo-top { font-size: 10px; letter-spacing: 0.8em; margin-bottom: 2vh; }
        .logo-bottom { font-size: 36px; }
        .menu-item { font-size: 22px; padding: 4px 30px; }
        .planet-far { width: 100px; height: 100px; }
        .ui-center-group { padding-bottom: 0; }
        .gradient-top, .gradient-bottom { filter: blur(40px); }
        .comet::after { width: 200px; }
        .comet::before { width: 100px; }
    }
</style>
</head>
<body>

<div class="scene">
    <div class="bg-container">
        <div class="sky parallax-layer" data-speed="0"></div>
        <div class="stars parallax-layer" id="stars" data-speed="0.1"></div>
        <div class="planet-far parallax-layer" data-speed="0.15"></div>
    </div>

    <div class="gradient-layer">
        <div class="gradient-top"></div>
        <div class="gradient-bottom"></div>
    </div>

    <div class="comet-container" id="comet-container"></div>
    <div class="vignette"></div>

    <div class="ui-center-group">
        <div class="logo-container" id="logoContainer">
            <div class="logo-top">Космические</div>
            <div class="logo-bottom" id="logoBottom">
                <div class="logo-line" id="line1"></div>
                <div class="logo-line" id="line2"></div>
            </div>
        </div>

        <div class="menu" id="menu">
            <button class="menu-item" data-action="map">Играть</button>
            <button class="menu-item" data-action="sanctuary">Убежище</button>
            <button class="menu-item" data-action="settings">Настройки</button>
            <button class="menu-item" data-action="quit">Выйти</button>
        </div>
    </div>

    <div class="footer">v0.2 alpha <span>•</span> first landing</div>
</div>

<script>
    // ═══════════════ ЗВЁЗДЫ ═══════════════
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 400; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.4 + 0.4;
        s.style.width = size + 'px'; s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3) + 's';
        s.style.animationDuration = (2 + Math.random() * 4) + 's';
        s.style.background = Math.random() < 0.2 ? '#a8c8ff' : (Math.random() < 0.1 ? '#d0e0ff' : '#fff');
        s.style.boxShadow = `0 0 ${size * 2.5}px rgba(255,255,255,0.7)`;
        starsContainer.appendChild(s);
    }

    // ═══════════════ ЗВЁЗДЫ ВОКРУГ ЛОГОТИПА ═══════════════
    const logoContainer = document.getElementById('logoContainer');
    const starPositions = [
        { top: '-15%', left: '-15%', size: '24px' },
        { top: '30%', right: '-15%', size: '18px', delay: '0.5s' },
        { bottom: '-5%', left: '20%', size: '14px', delay: '1s' },
        { bottom: '20%', right: '10%', size: '28px', delay: '1.5s' }
    ];
    starPositions.forEach(pos => {
        const star = document.createElement('div');
        star.className = 'logo-star';
        star.style.fontSize = pos.size;
        if (pos.top) star.style.top = pos.top;
        if (pos.left) star.style.left = pos.left;
        if (pos.right) star.style.right = pos.right;
        if (pos.bottom) star.style.bottom = pos.bottom;
        if (pos.delay) star.style.animationDelay = pos.delay;
        logoContainer.appendChild(star);
    });

    // ═══════════════ ТЕКСТ ЛОГОТИПА ═══════════════
    function makeLetters(text, containerId, replaceO = false) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        for (const char of text) {
            if (replaceO && char === 'О') {
                const span = document.createElement('span');
                span.className = 'logo-letter planet-o';
                container.appendChild(span);
            } else {
                const span = document.createElement('span');
                span.className = 'logo-letter';
                span.textContent = char;
                container.appendChild(span);
            }
        }
    }
    makeLetters("ХРОНИКИ", "line1", false);
    makeLetters("ЗВЕРЬКОВ", "line2", true);

    // ═══════════════ ПАРАЛЛАКС ═══════════════
    const parallaxLayers = document.querySelectorAll('.parallax-layer');
    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    function animateParallax() {
        mouseX += (targetX - mouseX) * 0.05;
        mouseY += (targetY - mouseY) * 0.05;
        parallaxLayers.forEach(layer => {
            const speed = parseFloat(layer.dataset.speed) || 0;
            layer.style.transform = `translate(${mouseX * speed * 40}px, ${mouseY * speed * 20}px)`;
        });
        requestAnimationFrame(animateParallax);
    }
    animateParallax();

    // ═══════════════ КОМЕТЫ ═══════════════
    const cometContainer = document.getElementById('comet-container');
    function spawnComet() {
        const comet = document.createElement('div');
        comet.className = 'comet';
        const angle = Math.random() * Math.PI * 2;
        const angleDeg = angle * 180 / Math.PI;
        const edge = Math.random();
        let startX, startY;
        if (edge < 0.25)      { startX = Math.random() * 100; startY = -10; }
        else if (edge < 0.5)  { startX = 110; startY = Math.random() * 100; }
        else if (edge < 0.75) { startX = Math.random() * 100; startY = 110; }
        else                  { startX = -10; startY = Math.random() * 100; }
        comet.style.left = startX + '%';
        comet.style.top = startY + '%';
        comet.style.transform = `rotate(${angleDeg + 45}deg)`;
        const size = 4 + Math.random() * 6;
        comet.style.width = size + 'px';
        comet.style.height = size + 'px';
        const duration = 2.5 + Math.random() * 3.5;
        comet.style.animationDuration = duration + 's';
        cometContainer.appendChild(comet);
        setTimeout(() => comet.remove(), duration * 1000);
        setTimeout(spawnComet, 1500 + Math.random() * 2500);
    }
    setTimeout(spawnComet, 1000);

    // ═══════════════ МЕНЮ ═══════════════
    const items = document.querySelectorAll('.menu-item');
    items[0].classList.add('active');

    // Немного генерируем SVG «круг» для пунктов
    items.forEach(btn => {
        const circle = document.createElement('span');
        circle.className = 'circle';
        circle.innerHTML = `<svg viewBox="0 0 240 70" preserveAspectRatio="none">
            <path d="M 120 8 C 60 4, 10 22, 12 40 C 14 58, 70 68, 120 64 C 180 60, 232 46, 228 30 C 224 14, 170 6, 110 12 C 80 16, 56 22, 50 30" />
        </svg>`;
        btn.appendChild(circle);

        btn.addEventListener('mouseenter', () => {
            items.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
        btn.addEventListener('focus', () => {
            items.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
        btn.addEventListener('click', () => {
            const action = btn.dataset.action;
            switch (action) {
                case 'map':       window.location.href = 'map.html'; break;
                case 'sanctuary': alert('Убежище (в разработке)'); break;
                case 'settings':  alert('Настройки (в разработке)'); break;
                case 'quit':      if (confirm('Покинуть Космос?')) window.close(); break;
            }
        });
    });

    document.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        e.preventDefault();
        let idx = Array.from(items).findIndex(b => b.classList.contains('active'));
        if (idx < 0) idx = 0;
        idx = e.key === 'ArrowDown' ? (idx + 1) % items.length : (idx - 1 + items.length) % items.length;
        items.forEach(b => b.classList.remove('active'));
        items[idx].classList.add('active');
        items[idx].focus();
    });
</script>

</body>
</html>

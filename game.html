<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лес — Космические Хроники Зверьков</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@300;600&family=Rubik+One&display=swap" rel="stylesheet">

<link rel="stylesheet" href="game.css">
</head>
<body>

<canvas id="c"></canvas>

<!-- КАРТОЧКА ПИЛОТА (вместо кнопки "В меню") -->
<div id="player-profile" class="player-profile">
    <div class="profile-avatar" id="profile-avatar">
        <!-- Сюда JS вставит цветной квадратик, глаза через CSS -->
    </div>
    <div class="profile-info">
        <div class="profile-top">
            <span class="profile-nick" id="profile-nick">Игрок</span>
            <span class="profile-level" id="profile-level">Lvl 1</span>
            <div class="profile-lives" id="profile-lives">❤️❤️❤️</div>
            <button class="profile-menu-btn" id="profile-menu-btn" title="Пауза / Меню">⚙</button>
        </div>
        <div class="profile-xp-bar">
            <div class="profile-xp-fill" id="profile-xp-fill"></div>
            <span class="profile-xp-text" id="profile-xp-text">0 / 100 XP</span>
        </div>
    </div>
</div>

<!-- HUD (Ресурсы и Портал) -->
<div id="hud">
    <div class="hud-item lives" style="display: none;"> <!-- Скрыли, так как жизни теперь в профиле -->
        <span class="icon">❤️</span>
        <span class="value" id="hud-lives">❤️❤️❤️</span>
    </div>
    <div class="hud-item">
        <span class="icon">🍓</span>
        <span class="value" id="hud-berries">0 / 0</span>
    </div>
    <div class="hud-item">
        <span class="icon">💎</span>
        <span class="value" id="hud-crystals">0 / 0</span>
    </div>
    <div class="hud-item">
        <span class="icon">🌰</span>
        <span class="value" id="hud-nuts">0 / 0</span>
    </div>
    <div class="hud-item portal">
        <span class="label">Портал</span>
        <span class="value" id="hud-portal">ЗАКРЫТ</span>
    </div>
    <div class="hud-item" style="background: rgba(100, 255, 200, 0.1); border-color: rgba(100, 255, 200, 0.3);">
        <span class="icon">👤</span>
        <span class="value" id="hud-personal" style="color: #88ffcc;">0</span>
    </div>
</div>

<div class="controls-hint">
    <b>← →</b> бег · <b>↑ / W / Space</b> прыжок · <b>Shift</b> рывок · <b>Esc</b> пауза
</div>

<div id="chat" class="chat">
    <div class="chat-resizer" id="chat-resizer"></div>
    <div class="chat-header">
        <div class="chat-title">💬 Чат</div>
        <div class="chat-actions">
            <button class="chat-btn" id="chat-settings-btn" title="Настройки чата">⚙</button>
            <button class="chat-btn" id="chat-toggle" title="Свернуть">—</button>
        </div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-wrap">
        <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение..." maxlength="120">
        <button class="chat-send" id="chat-send">→</button>
    </div>
    <div class="chat-settings hidden" id="chat-settings">
        <label class="chat-setting">
            <span>🕒 Показывать время</span>
            <label class="switch small">
                <input type="checkbox" id="chat-show-time">
                <span class="slider"></span>
            </label>
        </label>
        <label class="chat-setting">
            <span>🔔 Звук сообщения</span>
            <label class="switch small">
                <input type="checkbox" id="chat-sound" checked>
                <span class="slider"></span>
            </label>
        </label>
        <label class="chat-setting">
            <span>📢 Системные сообщения</span>
            <label class="switch small">
                <input type="checkbox" id="chat-system" checked>
                <span class="slider"></span>
            </label>
        </label>
        <div class="chat-setting">
            <span>🧹 Очистить историю</span>
            <button class="chat-btn" id="chat-clear" style="color:#ff7088;">Очистить</button>
        </div>
    </div>
</div>

<div id="win-screen" class="fullscreen">
    <div class="win-panel">
        <h1>ЭВАКУАЦИЯ!</h1>
        <div class="subtitle">Ты добрался до портала с орехом</div>
        <div class="stats-block" id="win-stats"></div>
        
        <div class="buttons">
            <button class="menu-btn" id="btn-wait">⏳ Ожидание...</button>
            <button class="menu-btn" id="btn-solo-next">🎲 Продолжить один</button>
            <button class="menu-btn" id="btn-leave-alone">🚪 Уйти одному (в меню)</button>
            <button class="menu-btn" id="btn-next" style="display: none;">🎲 Следующий уровень</button>
        </div>
    </div>
</div>

<div id="pause-screen" class="fullscreen">
    <div class="win-panel">
        <h1>ПАУЗА</h1>
        <div class="subtitle">отдохни немного</div>
        <div class="buttons">
            <button class="menu-btn" id="btn-resume">Продолжить</button>
            <button class="menu-btn" id="btn-pause-settings">Настройки</button>
            <button class="menu-btn" id="btn-pause-restart">Заново</button>
            <button class="menu-btn" id="btn-pause-menu">В меню</button>
        </div>

        <div id="pause-settings" class="pause-settings hidden">
            <div class="pause-nick">
                <label class="pause-nick-label">👤 Ник персонажа</label>
                <input type="text" id="pause-nickname" class="pause-nick-input" maxlength="16" placeholder="Игрок">
            </div>
            
            <div class="setting-item">
                <span class="label">🎯 Центрирование карты</span>
                <label class="switch">
                    <input type="checkbox" id="setting-center" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span class="label">🎮 Слежение за героем</span>
                <label class="switch">
                    <input type="checkbox" id="setting-follow">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
</div>

<!-- ЭМОЦИИ (Колесо) -->
<div class="emote-wheel" id="emoteWheel">
    <div class="wheel-container">
        <div class="wheel-center">Выбор</div>
        <div class="emote-sector pos-up" data-emote="heart" data-key="1">❤️ <span class="sector-key">1</span></div>
        <div class="emote-sector pos-right" data-emote="laugh" data-key="2">😂 <span class="sector-key">2</span></div>
        <div class="emote-sector pos-down" data-emote="sad" data-key="3">😢 <span class="sector-key">3</span></div>
        <div class="emote-sector pos-left" data-emote="angry" data-key="4">😡 <span class="sector-key">4</span></div>
    </div>
</div>    
    
<div id="mobile-controls" class="mobile-controls">
    <div class="dpad">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <div class="action-btns">
        <button class="ctrl-btn action-btn" id="btn-dash">DASH</button>
        <button class="ctrl-btn action-btn" id="btn-jump">JUMP</button>
    </div>
</div>

<script src="audio.js"></script>
<script src="level-generator.js"></script>
<script src="level.js"></script>
<script src="player.js"></script>
<script src="tiles.js"></script>
<script src="game.js"></script>

</body>
</html>
